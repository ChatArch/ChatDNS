[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatDNS"
dynamic = ["version"]
description = "ChatDNS: ChatArch DNS record, DDNS, and provider helper extracted from ChatTool."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.0",
    "chatstyle>=0.1.0,<0.2.0",
    "chatenv>=0.2.0,<0.3.0",
    "aiohttp>=3.8",
    "netifaces",
    "alibabacloud_alidns20150109>=3.5.10",
    "alibabacloud_tea_openapi>=0.3.0",
    "tencentcloud-sdk-python",
    "requests>=2.31",
    "cryptography>=41",
]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatdns", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatDNS"
Repository = "https://github.com/ChatArch/ChatDNS"
Documentation = "https://ChatArch.github.io/ChatDNS"

[project.scripts]
chatdns = "chatdns.cli:main"

[project.optional-dependencies]
dev = ["build", "pytest", "pytest-asyncio", "twine"]
docs = ["mkdocs>=1.4.0", "mkdocs-material>=9.0.0", "mike>=2.0.0"]
mcp = ["fastmcp; python_version >= '3.10'"]

[project.entry-points."chatenv.configs"]
chatdns = "chatdns.config"

[tool.setuptools.dynamic]
version = {attr = "chatdns.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
