site_name: ChatDNS Docs
site_description: DNS, DDNS, and ACME DNS-01 tooling for ChatArch
site_url: https://arch.gh.wzhecnu.cn/ChatDNS/
repo_url: https://github.com/ChatArch/ChatDNS
repo_name: ChatArch/ChatDNS
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
          site_name: ChatDNS 文档
        - locale: en
          name: English
          build: true
          site_name: ChatDNS Documentation

nav:
  - index.md
  - quickstart.md
  - cli-tree.md
  - certificate-storage.md
